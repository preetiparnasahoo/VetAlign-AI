[pytest]
testpaths = tests
# Checkpoints are immutable snapshots containing copies of the test files.
# Collecting them alongside the working tests causes duplicate module basenames
# and an import-file-mismatch error, so they are excluded here. To run a
# checkpoint's own suite, cd into that folder and run pytest there.
norecursedirs = checkpoints vetalign_ai .git __pycache__
